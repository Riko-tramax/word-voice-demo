<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>单词朗读 Demo</title>
  <style>
    :root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#202124;background:#fff}
    *{box-sizing:border-box}
    body{margin:0}
    main{max-width:680px;margin:14vh auto 64px;padding:0 24px}
    label{display:block;font-size:17px;font-weight:600;margin-bottom:14px}
    form div{display:flex;gap:10px}
    input,button{font:inherit}
    input{flex:1;min-width:0;padding:12px 14px;border:1px solid #c8cdd0;border-radius:7px;background:transparent;color:inherit;outline:none}
    input:focus{border-color:#4b6889;box-shadow:0 0 0 2px #4b688933}
    button{padding:12px 18px;border:0;border-radius:7px;background:#344e68;color:#fff;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}
    #status{min-height:1.5em;margin:12px 0 28px;font-size:13px;color:#626970}
    #status.error{color:#a33b32}
    #result[hidden]{display:none}
    .player-label{display:block;font-size:14px;font-weight:600;margin:0 0 10px}
    .audio-group{margin-bottom:28px}
    .audio-group[hidden]{display:none}
    audio{display:block;width:100%;margin-bottom:18px}
    details{border-top:1px solid #d9dde0;padding-top:16px}
    summary{cursor:pointer;font-size:14px;color:#344e68;user-select:none}
    .example{padding:18px 0;border-bottom:1px solid #e5e8ea}
    .example p{margin:0 0 8px;line-height:1.6}
    .example .meaning{font-size:14px;color:#5f666b}
    .example .usage{margin:0;font-size:12px;color:#7a8185}
    @media(max-width:520px){main{margin-top:11vh;padding:0 18px}form div{flex-direction:column}button{width:100%}}
    @media(prefers-color-scheme:dark){:root{color:#f1f3f4;background:#17191b}input{border-color:#5d646a}input:focus{border-color:#9db8d4;box-shadow:0 0 0 2px #9db8d433}button{background:#8aaccd;color:#142331}#status{color:#aeb5ba}summary{color:#a9c6e2}details{border-color:#444b50}.example{border-color:#373d42}.example .meaning{color:#c4c9cc}.example .usage{color:#a5acb0}}
  </style>
</head>
<body>
  <main>
    <form id="form">
      <label for="word">输入英语单词</label>
      <div>
        <input id="word" name="word" type="text" maxlength="40" pattern="[A-Za-z][A-Za-z'-]*" placeholder="请输入单词" autocomplete="off" spellcheck="false" required>
        <button id="submit" type="submit">生成朗读</button>
      </div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="result" hidden>
      <div class="audio-group">
        <label class="player-label" for="audio">原单词例句朗读</label>
        <audio id="audio" controls preload="metadata" aria-label="原单词例句朗读"></audio>
        <details id="examples">
          <summary>查看三个例句</summary>
          <div id="example-list"></div>
        </details>
      </div>
      <div class="audio-group" id="meaning-group" hidden>
        <label class="player-label" for="meaning-audio">含义易混淆对比例句朗读</label>
        <audio id="meaning-audio" controls preload="metadata" aria-label="含义易混淆对比例句朗读"></audio>
        <details id="meaning-details"><summary>查看含义对比例句</summary><div id="meaning-list"></div></details>
      </div>
      <div class="audio-group" id="sound-group" hidden>
        <label class="player-label" for="sound-audio">读音易混淆对比例句朗读</label>
        <audio id="sound-audio" controls preload="metadata" aria-label="读音易混淆对比例句朗读"></audio>
        <details id="sound-details"><summary>查看读音对比例句</summary><div id="sound-list"></div></details>
      </div>
    </section>
  </main>
  <script>
    const API_URL='https://xnnabegwfpxibkrdtmwy.supabase.co/functions/v1/word-voice-demo';
    const form=document.querySelector('#form'),input=document.querySelector('#word'),button=document.querySelector('#submit');
    const status=document.querySelector('#status'),result=document.querySelector('#result');
    const audio=document.querySelector('#audio'),examples=document.querySelector('#examples'),list=document.querySelector('#example-list');
    const comparison={
      meaning:{group:document.querySelector('#meaning-group'),audio:document.querySelector('#meaning-audio'),details:document.querySelector('#meaning-details'),list:document.querySelector('#meaning-list')},
      sound:{group:document.querySelector('#sound-group'),audio:document.querySelector('#sound-audio'),details:document.querySelector('#sound-details'),list:document.querySelector('#sound-list')}
    };
    function say(message,error=false){status.textContent=message;status.classList.toggle('error',error)}
    function render(data){
      list.replaceChildren();
      data.examples.forEach(item=>{
        const card=document.createElement('div');card.className='example';
        const sentence=document.createElement('p');sentence.textContent=item.sentence;card.append(sentence);
        const meaning=document.createElement('p');meaning.className='meaning';meaning.textContent=item.meaning;card.append(meaning);
        if(item.usage){const usage=document.createElement('p');usage.className='usage';usage.textContent=item.usage;card.append(usage)}
        list.append(card);
      });
      audio.src='data:audio/mpeg;base64,'+data.audio_base64;
      examples.open=false;
      for(const kind of ['meaning','sound']){
        const view=comparison[kind],pair=data.confusables?.[kind];
        view.list.replaceChildren();view.details.open=false;
        if(!pair?.audio_base64){view.group.hidden=true;continue}
        const words=document.createElement('p');words.className='meaning';words.textContent=`${data.word} / ${pair.word}`;view.list.append(words);
        for(const sentence of [pair.target_sentence,pair.other_sentence]){
          const line=document.createElement('p');line.textContent=sentence;view.list.append(line);
        }
        const difference=document.createElement('p');difference.className='meaning';difference.textContent=pair.difference;view.list.append(difference);
        view.audio.src='data:audio/mpeg;base64,'+pair.audio_base64;
        view.group.hidden=false;
      }
      result.hidden=false;
    }
    async function generate(word){
      if(!/^[A-Za-z][A-Za-z'-]{0,39}$/.test(word)){say('请输入一个英语单词。',true);input.focus();return}
      button.disabled=true;result.hidden=true;
      for(const player of [audio,comparison.meaning.audio,comparison.sound.audio]){player.pause();player.removeAttribute('src');player.load()}
      say('正在生成，请稍候…');
      try{
        const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({word})});
        const data=await response.json();
        if(!response.ok)throw new Error(data.error||'生成失败，请稍后重试。');
        render(data);say('生成完成，点击播放器收听。');
      }catch(error){say(error.message||'网络连接失败，请稍后重试。',true)}
      finally{button.disabled=false}
    }
    form.addEventListener('submit',event=>{event.preventDefault();generate(input.value.trim())});
  </script>
</body>
</html>
